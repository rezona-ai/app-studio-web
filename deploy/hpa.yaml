# 由 _deploy.yml 经 envsubst 渲染后 kubectl apply。
# 变量：$ENVIRONMENT $NAMESPACE $HPA_MIN_REPLICAS $HPA_MAX_REPLICAS
# HPA 控制弹性副本数;同文件下的 PDB 保证自愿驱逐(节点维护/升级)时至少留 1 个可用端点。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rezonalab-game-web-${ENVIRONMENT}
  namespace: ${NAMESPACE}
  labels:
    app: rezonalab-game-web
    env: ${ENVIRONMENT}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rezonalab-game-web-${ENVIRONMENT}
  minReplicas: ${HPA_MIN_REPLICAS}
  maxReplicas: ${HPA_MAX_REPLICAS}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rezonalab-game-web-${ENVIRONMENT}-pdb
  namespace: ${NAMESPACE}
  labels:
    app: rezonalab-game-web
    env: ${ENVIRONMENT}
spec:
  # 比例制:min=2 时 ceil(50%)=1,自愿驱逐(节点升级/维护)期间至少保留 1 个端点,
  # standalone NEG 不会被 drain 到零;dev 若临时缩到 1 副本则等价于「不允许驱逐」,行为安全。
  minAvailable: 50%
  selector:
    matchLabels:
      app: rezonalab-game-web
      env: ${ENVIRONMENT}
